<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QB Challenge — Concept×Coverage 管理端</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, 'Courier New', monospace; padding: 12px; font-size: 14px; }
h1 { color: #c8a85c; text-align: center; margin-bottom: 4px; font-size: 18px; }
.subtitle { text-align: center; color: #888; font-size: 11px; margin-bottom: 12px; }

.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
.tab { padding: 6px 14px; background: #2a2a4e; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 13px; color: #aaa; }
.tab:hover { background: #3a3a5e; color: #fff; }
.tab.active { background: #4a3a2e; border-color: #c8a85c; color: #c8a85c; }

.cover-info { background: #222240; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; }
.cover-title { color: #c8a85c; font-size: 16px; font-weight: bold; }
.cover-desc { color: #aaa; margin-top: 4px; }

.legend { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; font-size: 11px; }
.legend span { padding: 3px 8px; border-radius: 4px; }
.lg-beat { background: #1a3a1a; border: 1px solid #4CAF50; color: #8f8; }
.lg-ok { background: #2a2a3e; border: 1px solid #666; color: #aaa; }
.lg-bad { background: #3a1a1a; border: 1px solid #f44336; color: #f88; }

.concept-list { display: flex; flex-direction: column; gap: 6px; }
.concept-row { display: flex; align-items: center; background: #222240; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; cursor: pointer; transition: all 0.15s; }
.concept-row:hover { border-color: #666; }
.concept-row.beat { border-left: 4px solid #4CAF50; background: #1a2e1a; }
.concept-row.bad { border-left: 4px solid #f44336; background: #2e1a1a; }
.concept-row.ok { border-left: 4px solid #666; }
.concept-row.expanded { background: #2a2a4e; }
.c-name { font-weight: bold; font-size: 14px; min-width: 120px; color: #e0e0e0; }
.c-diagram { margin: 0 8px; flex-shrink: 0; }
.c-routes { font-size: 11px; color: #888; flex: 1; }
.c-routes .r-deep { color: #6af; }
.c-routes .r-short { color: #8d8; }
.c-routes .r-mid { color: #da8; }
.c-state { font-size: 18px; min-width: 30px; text-align: center; }
.c-reason { font-size: 11px; color: #aaa; max-width: 200px; text-align: right; }

/* Detail panel */
.detail { display: none; background: #1e1e3e; border: 1px solid #444; border-radius: 6px; padding: 12px; margin-top: 4px; margin-bottom: 4px; }
.detail.show { display: block; }
.detail-title { color: #c8a85c; font-size: 13px; margin-bottom: 6px; }
.detail-routes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.route-chip { padding: 3px 8px; border-radius: 4px; font-size: 11px; background: #2a2a4e; border: 1px solid #555; }
.route-chip.deep { border-color: #4a8af4; color: #6af; }
.route-chip.short { border-color: #4CAF50; color: #8d8; }
.route-chip.mid { border-color: #da8; color: #da8; }
.detail textarea { width: 100%; background: #1a1a2e; border: 1px solid #555; border-radius: 4px; color: #e0e0e0; padding: 6px; font-family: inherit; font-size: 12px; resize: vertical; min-height: 50px; margin-top: 6px; }
.detail .note-list { margin-top: 6px; }
.detail .note { background: #2a2a3e; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px; }
.detail .note .from { color: #c8a85c; font-weight: bold; }
.detail .note .msg { color: #ccc; margin-top: 2px; }
.btn-sm { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-right: 4px; }
.btn-beat { background: #2d5a2d; color: #8f8; }
.btn-ok { background: #3a3a5e; color: #aaa; }
.btn-bad { background: #5a2d2d; color: #f88; }
.btn-note { background: #4CAF50; color: #fff; margin-top: 4px; }

.summary { background: #222240; border: 1px solid #c8a85c; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; }
.summary h3 { color: #c8a85c; margin-bottom: 6px; }
.summary .stat { display: flex; gap: 16px; flex-wrap: wrap; }
.summary .s { color: #aaa; }
.summary .s b { color: #e0e0e0; }

.actions { text-align: center; margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
.btn-save { background: #c8a85c; color: #1a1a2e; }
.btn-export { background: #4a6a8a; color: #fff; }
pre#codeOut { display: none; background: #111; padding: 12px; margin-top: 12px; border-radius: 8px; font-size: 10px; overflow-x: auto; color: #8f8; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }

.filter { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.filter input { background: #2a2a4e; border: 1px solid #555; border-radius: 4px; color: #e0e0e0; padding: 4px 8px; font-size: 12px; width: 200px; }
</style>
</head>
<body>
<h1>🏈 Concept × Coverage 管理端</h1>
<p class="subtitle">点击concept行切换: ✅克制 → ⚪中性 → ❌避免 | 展开可添加原因和讨论</p>

<div class="legend">
  <span class="lg-beat">✅ 克制concept</span>
  <span class="lg-ok">⚪ 中性</span>
  <span class="lg-bad">❌ 不适合打</span>
</div>

<div class="tabs" id="tabs"></div>
<div class="cover-info" id="coverInfo"></div>
<div class="filter"><input id="search" placeholder="搜索阵型名..." oninput="render()"></div>
<div class="concept-list" id="conceptList"></div>

<div class="summary" id="summary"></div>

<div class="actions">
  <button class="btn btn-save" onclick="save()">💾 保存</button>
  <button class="btn btn-export" onclick="exportJS()">📋 导出JS代码</button>
</div>
<pre id="codeOut"></pre>

<script>
const FORMATIONS = [
  {name:'Shotgun Spread', routes:['streak','slant','out','post']},
  {name:'Trips Right', routes:['curl','slant','out','streak']},
  {name:'Trips Left', routes:['streak','out','slant','curl']},
  {name:'Bunch Right', routes:['post','flat','slant','streak']},
  {name:'Empty Spread', routes:['streak','drag','drag','streak']},
  {name:'Slot Left', routes:['post','slant','curl','out']},
  {name:'4 Verticals', routes:['streak','streak','streak','streak']},
  {name:'Verts Switch', routes:['streak','post','post','streak']},
  {name:'Streak Left', routes:['streak','streak','streak','flat']},
  {name:'Quick Slants', routes:['slant','slant','slant','slant']},
  {name:'Quick Out', routes:['out','out','out','out']},
  {name:'Flat/Screen', routes:['flat','curl','curl','flat']},
  {name:'Hitch Concept', routes:['hitch','hitch','hitch','hitch']},
  {name:'Quick Drag', routes:['drag','curl','drag','curl']},
  {name:'Mesh', routes:['streak','drag','drag','post']},
  {name:'Drive', routes:['streak','drag','drag','seam']},
  {name:'Scissors', routes:['flat','post','corner','flat']},
  {name:'Cross Flow', routes:['drag','slant','slant','drag']},
  {name:'Flood Right', routes:['streak','out','flat','streak']},
  {name:'Flood Left', routes:['streak','flat','out','streak']},
  {name:'Levels Right', routes:['post','out','flat','streak']},
  {name:'Levels Left', routes:['streak','flat','out','post']},
  {name:'Curl-Flat', routes:['flat','curl','curl','flat']},
  {name:'Smash Right', routes:['post','drag','hitch','corner']},
  {name:'Smash Left', routes:['corner','hitch','drag','post']},
  {name:'Dagger', routes:['flat','post','dig','streak']},
  {name:'Mills', routes:['flat','post','dig','seam']},
  {name:'Y-Cross', routes:['curl','slant','dig','hitch']},
  {name:'All Curls', routes:['curl','curl','curl','curl']},
  {name:'Wheel Route', routes:['wheel','flat','hitch','curl']},
  {name:'Corner Strike', routes:['corner','flat','drag','corner']},
  {name:'Deep Cross', routes:['flat','post','post','flat']},
  {name:'Double Post', routes:['flat','post','post','dig']},
  {name:'Spacing', routes:['out','hitch','hitch','out']},
  {name:'Snag', routes:['flat','corner','hitch','streak']},
  {name:'China', routes:['out','post','drag','streak']},
];

const COVERAGES = {
  'Cover 1': { desc: '1 rusher + 3 man + 1 FS', detail: '3人盯4个WR → 1个WR free。FS站中路deep读QB。' },
  'Cover 2': { desc: '1 rusher + 2 deep + 2 flat', detail: '2人深区两侧 + 2人短区。中路deep是缝隙。' },
  'Cover 3': { desc: '1 rusher + 3 deep + 1 flat', detail: '3人守deep + 1人守整个underneath。flat defender覆盖不过来。' },
  'Cover 4': { desc: '1 rusher + 4 deep (Quarters)', detail: 'underneath完全放空。short route = 免费码数。' },
  'Man Blitz': { desc: '1 fast rusher + 4 man', detail: '全盯人 + 快速冲传。出手时间极短。' },
};

const ROUTE_TYPE = {
  streak:'deep', post:'deep', corner:'deep', seam:'deep', wheel:'deep',
  slant:'short', drag:'short', flat:'short', curl:'short', hitch:'short',
  out:'mid', dig:'mid'
};

// ── Route path drawing ──
// Routes: start from WR position, draw segments
// WR positions: lane 0-60 (left to right), yard goes UP (toward endzone)
// Canvas: x = lane (horizontal), y = yard (vertical, inverted: up = deeper)
const ROUTE_PATHS = {
  streak: (sl) => [{x:sl, y:-20}],
  slant:  (sl) => [{x:sl+(sl<30?10:-10), y:-12}],
  out:    (sl) => [{x:sl, y:-7}, {x:sl+(sl<30?-12:12), y:-7}],
  post:   (sl) => [{x:sl, y:-8}, {x:sl+(sl<30?8:-8), y:-20}],
  curl:   (sl) => [{x:sl, y:-10}, {x:sl+(sl<30?-2:2), y:-8}],
  flat:   (sl) => [{x:sl+(sl<30?-8:8), y:-2}],
  drag:   (sl) => [{x:sl+(sl<30?18:-18), y:-3}],
  corner: (sl) => [{x:sl, y:-7}, {x:sl+(sl<30?-10:10), y:-18}],
  hitch:  (sl) => [{x:sl, y:-5}, {x:sl, y:-4}],
  wheel:  (sl) => [{x:sl+(sl<30?-4:4), y:-2}, {x:sl+(sl<30?-4:4), y:-20}],
  dig:    (sl) => [{x:sl, y:-10}, {x:sl+(sl<30?15:-15), y:-10}],
  seam:   (sl) => [{x:sl+(sl<30?3:-3), y:-15}],
};

// WR starting lanes for each formation
const FORMATION_WR_LANES = {};
FORMATIONS.forEach(f => {
  // Approximate WR lanes from game data
  const laneMap = {
    'Shotgun Spread': [5,18,42,55], 'Trips Right': [5,38,46,54], 'Trips Left': [6,14,22,55],
    'Bunch Right': [5,40,44,48], 'Empty Spread': [4,18,42,56], 'Slot Left': [5,18,44,55],
    '4 Verticals': [5,20,40,55], 'Verts Switch': [5,20,40,55], 'Streak Left': [6,16,24,54],
    'Quick Slants': [6,20,40,54], 'Quick Out': [6,20,40,54], 'Flat/Screen': [6,20,40,54],
    'Hitch Concept': [6,20,40,54], 'Quick Drag': [6,20,40,54], 'Mesh': [6,20,40,54],
    'Drive': [6,20,40,54], 'Scissors': [6,20,40,54], 'Cross Flow': [6,20,40,54],
    'Flood Right': [5,25,35,55], 'Flood Left': [5,25,35,55], 'Levels Right': [5,25,35,55],
    'Levels Left': [5,25,35,55], 'Curl-Flat': [6,20,40,54], 'Smash Right': [5,25,35,55],
    'Smash Left': [5,25,35,55], 'Dagger': [6,20,40,54], 'Mills': [6,20,40,54],
    'Y-Cross': [6,20,40,54], 'All Curls': [6,20,40,54], 'Wheel Route': [6,20,40,54],
    'Corner Strike': [6,20,40,54], 'Deep Cross': [6,20,40,54], 'Double Post': [6,20,40,54],
    'Spacing': [6,20,40,54], 'Snag': [6,20,40,54], 'China': [6,20,40,54],
  };
  FORMATION_WR_LANES[f.name] = laneMap[f.name] || [6,20,40,54];
});

const ROUTE_COLORS = ['#4af','#f84','#4f8','#f4f'];

function drawPlayDiagram(canvas, formation) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scale = W / 66; // 60 lanes + margin

  ctx.clearRect(0,0,W,H);
  // Field background
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0,0,W,H);

  // LOS line
  const losY = H * 0.75;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(0, losY); ctx.lineTo(W, losY); ctx.stroke();
  ctx.setLineDash([]);

  // QB
  const qbX = 30 * scale;
  const qbY = losY + 12;
  ctx.fillStyle = '#c8a85c';
  ctx.beginPath(); ctx.arc(qbX, qbY, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#888'; ctx.font = '7px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('QB', qbX, qbY + 12);

  // Draw each WR and their route
  const lanes = FORMATION_WR_LANES[formation.name] || [6,20,40,54];
  formation.routes.forEach((route, i) => {
    const sl = lanes[i];
    const wrX = sl * scale;
    const wrY = losY;

    // WR dot
    ctx.fillStyle = ROUTE_COLORS[i];
    ctx.beginPath(); ctx.arc(wrX, wrY, 3.5, 0, Math.PI*2); ctx.fill();

    // Route path
    const path = ROUTE_PATHS[route] ? ROUTE_PATHS[route](sl) : [];
    ctx.strokeStyle = ROUTE_COLORS[i];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wrX, wrY);
    for (const pt of path) {
      const px = pt.x * scale;
      const py = losY + pt.y * (H * 0.032);
      ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Arrow at end
    if (path.length > 0) {
      const last = path[path.length - 1];
      const lx = last.x * scale, ly = losY + last.y * (H * 0.032);
      ctx.fillStyle = ROUTE_COLORS[i];
      ctx.beginPath(); ctx.arc(lx, ly, 2, 0, Math.PI*2); ctx.fill();
    }

    // Route label
    ctx.fillStyle = ROUTE_COLORS[i]; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'center';
    const labelY = wrY + 10;
    ctx.fillText(route.toUpperCase(), wrX, labelY);
  });
}

let data = {}; // { 'Cover 1': { 'Shotgun Spread': {state:'beat'|'ok'|'bad', reason:'', notes:[]} } }
let currentCover = 'Cover 1';
let expandedIdx = -1;

function init() {
  const saved = localStorage.getItem('qb_admin_v2');
  if (saved) { data = JSON.parse(saved); }
  // Ensure all entries exist
  for (const cover of Object.keys(COVERAGES)) {
    if (!data[cover]) data[cover] = {};
    for (const f of FORMATIONS) {
      if (!data[cover][f.name]) data[cover][f.name] = { state: 'ok', reason: '', notes: [] };
    }
  }
  renderTabs();
  selectCover('Cover 1');
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  for (const cover of Object.keys(COVERAGES)) {
    const tab = document.createElement('div');
    tab.className = 'tab' + (cover === currentCover ? ' active' : '');
    // Count states
    const states = FORMATIONS.map(f => (data[cover]?.[f.name]?.state) || 'ok');
    const beats = states.filter(s => s === 'beat').length;
    const bads = states.filter(s => s === 'bad').length;
    tab.textContent = `${cover} (${beats}✅ ${bads}❌)`;
    tab.onclick = () => selectCover(cover);
    el.appendChild(tab);
  }
}

function selectCover(cover) {
  currentCover = cover;
  expandedIdx = -1;
  renderTabs();
  const info = COVERAGES[cover];
  document.getElementById('coverInfo').innerHTML = `
    <div class="cover-title">${cover}</div>
    <div class="cover-desc">${info.desc} — ${info.detail}</div>
  `;
  render();
  renderSummary();
}

function render() {
  const el = document.getElementById('conceptList');
  const search = document.getElementById('search').value.toLowerCase();
  el.innerHTML = '';

  FORMATIONS.forEach((f, idx) => {
    if (search && !f.name.toLowerCase().includes(search) && !f.routes.some(r => r.includes(search))) return;
    const d = data[currentCover][f.name] || { state: 'ok', reason: '', notes: [] };
    const stateIcon = d.state === 'beat' ? '✅' : d.state === 'bad' ? '❌' : '⚪';

    // Row
    const row = document.createElement('div');
    row.className = `concept-row ${d.state}`;
    const routeHTML = f.routes.map(r => `<span class="r-${ROUTE_TYPE[r]||'mid'}">${r.toUpperCase()}</span>`).join(' · ');
    row.innerHTML = `
      <div class="c-state">${stateIcon}</div>
      <div class="c-diagram"><canvas width="100" height="70" id="dia_${idx}"></canvas></div>
      <div class="c-name">${f.name}</div>
      <div class="c-routes">${routeHTML}</div>
      <div class="c-reason">${d.reason || ''}</div>
    `;
    row.onclick = (e) => {
      if (e.target.closest('.detail')) return;
      expandedIdx = expandedIdx === idx ? -1 : idx;
      render();
    };
    el.appendChild(row);
    // Draw diagram after DOM insert
    requestAnimationFrame(() => {
      const c = document.getElementById('dia_'+idx);
      if (c) drawPlayDiagram(c, f);
    });

    // Detail panel
    if (expandedIdx === idx) {
      const detail = document.createElement('div');
      detail.className = 'detail show';
      const routeChips = f.routes.map(r => `<span class="route-chip ${ROUTE_TYPE[r]||'mid'}">${r.toUpperCase()}</span>`).join('');
      const notesHTML = (d.notes || []).map(n => `<div class="note"><span class="from">${n.from}</span>: <span class="msg">${n.msg}</span></div>`).join('');
      detail.innerHTML = `
        <div class="detail-title">${f.name} vs ${currentCover}</div>
        <div class="detail-routes">${routeChips}</div>
        <div style="margin-bottom:8px">
          <button class="btn-sm btn-beat" onclick="setState('${f.name}','beat',event)">✅ 克制</button>
          <button class="btn-sm btn-ok" onclick="setState('${f.name}','ok',event)">⚪ 中性</button>
          <button class="btn-sm btn-bad" onclick="setState('${f.name}','bad',event)">❌ 避免</button>
        </div>
        <input style="width:100%;background:#1a1a2e;border:1px solid #555;border-radius:4px;color:#e0e0e0;padding:6px;font-size:12px;"
          placeholder="为什么这个concept克制/不克制这个防守？"
          value="${d.reason || ''}" onchange="setReason('${f.name}',this.value)">
        <div class="note-list">${notesHTML}</div>
        <textarea id="note_${idx}" placeholder="添加讨论..."></textarea>
        <button class="btn-sm btn-note" onclick="addNote('${f.name}',${idx},event)">发送</button>
      `;
      el.appendChild(detail);
    }
  });
}

function setState(name, state, e) {
  e.stopPropagation();
  data[currentCover][name].state = state;
  render(); renderTabs(); renderSummary(); save();
}
function setReason(name, reason) {
  data[currentCover][name].reason = reason;
  save();
}
function addNote(name, idx, e) {
  e.stopPropagation();
  const ta = document.getElementById('note_'+idx);
  const msg = ta.value.trim();
  if (!msg) return;
  if (!data[currentCover][name].notes) data[currentCover][name].notes = [];
  data[currentCover][name].notes.push({ from: 'Owen', msg, time: new Date().toLocaleString('zh-CN') });
  ta.value = '';
  render(); save();
}

function renderSummary() {
  const el = document.getElementById('summary');
  let html = '<h3>📊 当前配置总览</h3><div class="stat">';
  for (const cover of Object.keys(COVERAGES)) {
    const states = FORMATIONS.map(f => data[cover]?.[f.name]?.state || 'ok');
    const b = states.filter(s => s === 'beat').length;
    const d = states.filter(s => s === 'bad').length;
    const o = states.filter(s => s === 'ok').length;
    html += `<div class="s"><b>${cover}</b>: ${b}✅ ${o}⚪ ${d}❌</div>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

function save() {
  localStorage.setItem('qb_admin_v2', JSON.stringify(data));
}

function exportJS() {
  let code = '// ── Owen审核的 Concept × Coverage matchup表 ──\n';
  code += '// 生成自管理端 admin.html, ' + new Date().toLocaleString('zh-CN') + '\n';
  code += 'const CONCEPT_VS_COVERAGE = {\n';
  for (const cover of Object.keys(COVERAGES)) {
    code += `  '${cover}': {\n`;
    code += `    beat: [`;
    const beats = FORMATIONS.filter(f => data[cover]?.[f.name]?.state === 'beat').map(f => `'${f.name}'`);
    code += beats.join(', ');
    code += `],\n`;
    code += `    bad: [`;
    const bads = FORMATIONS.filter(f => data[cover]?.[f.name]?.state === 'bad').map(f => `'${f.name}'`);
    code += bads.join(', ');
    code += `],\n`;
    // Also export per-concept reasons for teaching
    const withReasons = FORMATIONS.filter(f => data[cover]?.[f.name]?.reason);
    if (withReasons.length > 0) {
      code += `    reasons: {\n`;
      for (const f of withReasons) {
        const r = data[cover][f.name].reason.replace(/'/g, "\\'");
        code += `      '${f.name}': '${r}',\n`;
      }
      code += `    },\n`;
    }
    code += `  },\n`;
  }
  code += '};\n';

  const el = document.getElementById('codeOut');
  el.style.display = 'block';
  el.textContent = code;
  navigator.clipboard.writeText(code).then(() => alert('📋 已复制到剪贴板')).catch(() => {});
}

init();
</script>
</body>
</html>
