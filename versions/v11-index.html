<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QB Challenge V8 — Next-Gen Broadcast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            border: 2px solid #222;
            border-radius: 2px;
            box-shadow: 0 0 40px rgba(0,80,200,0.15), 0 8px 32px rgba(0,0,0,0.8);
        }
        #loadingScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #ccc;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #loadingScreen h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 8px;
        }
        #loadingScreen .sub {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        #loadBar {
            width: 240px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }
        #loadFill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1e90ff, #ff4444);
            transition: width 0.2s;
        }
        #loadText {
            margin-top: 12px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1>QB CHALLENGE</h1>
        <div class="sub">NEXT-GEN BROADCAST</div>
        <div id="loadBar"><div id="loadFill"></div></div>
        <div id="loadText">Initializing...</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
